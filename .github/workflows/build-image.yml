name: Build, test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dombarker99/debian-gnome-novnc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build metadata
        id: metadata
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:test
          build-args: |
            APT_REFRESH=${{ steps.metadata.outputs.refresh }}
            IMAGE_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test GNOME, VNC, developer tools and persistence
        shell: bash
        run: bash tests/smoke-test.sh "$IMAGE:test" "$RUNNER_TEMP/image-test-artifacts"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Authenticate to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          for tag in 13 latest "sha-${{ steps.metadata.outputs.short_sha }}"; do
            docker tag "$IMAGE:test" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo '### Tested image published'
            echo "Image: \`$IMAGE:13\`"
            echo "Commit tag: \`$IMAGE:sha-${{ steps.metadata.outputs.short_sha }}\`"
            echo 'The following anonymous-access check verifies package readability independently of repository visibility.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous GHCR access and image configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: python3 tests/verify-publication.py "$IMAGE:13"
