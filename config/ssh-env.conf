# SSH exec commands need the same tool paths as interactive desktop shells.
SetEnv PATH=/home/desktop/.local/bin:/home/desktop/.cargo/bin:/opt/java/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin NPM_CONFIG_PREFIX=/home/desktop/.local RUSTUP_HOME=/opt/rustup JAVA_HOME=/opt/java DISPLAY=:1 XDG_RUNTIME_DIR=/tmp/gnome-runtime-1000 XAUTHORITY=/tmp/gnome-runtime-1000/Xauthority DBUS_SYSTEM_BUS_ADDRESS=unix:path=/tmp/gnome-runtime-1000/system-bus LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
