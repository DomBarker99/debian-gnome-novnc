<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- An isolated system-type bus for GNOME's container-local IPC. No host bus,
       privileged activation helper, or hardware/system services are exposed. -->
  <type>system</type>
  <listen>unix:path=/tmp/gnome-runtime-1000/system-bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="1000"/>
    <allow user="root"/>
  </policy>
  <policy user="1000">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
